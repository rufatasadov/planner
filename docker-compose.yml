services:
  db:
    image: postgres:16-alpine
    container_name: planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - planner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: planner-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://planner:${POSTGRES_PASSWORD:-planner}@db:5432/planner
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set (see .env.example)}
      JWT_EXPIRES_IN: 30d
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-allforaze@gmail.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      PADDLE_ENV: ${PADDLE_ENV:-production}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_PRO_MONTHLY: ${PADDLE_PRICE_PRO_MONTHLY:-}
      PADDLE_PRICE_PRO_YEARLY: ${PADDLE_PRICE_PRO_YEARLY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Full database dump on start and then every BACKUP_INTERVAL_HOURS into ./backups
  backup:
    image: postgres:16-alpine
    container_name: planner-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    environment:
      PGUSER: planner
      PGDATABASE: planner
      PGPASSWORD: ${POSTGRES_PASSWORD:-planner}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: planner-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

  # HTTPS reverse proxy for production; enabled with COMPOSE_PROFILES=prod in .env
  caddy:
    image: caddy:2-alpine
    container_name: planner-caddy
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-extra:/etc/caddy/extra:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  planner-data:
  caddy-data:
  caddy-config:
