services:
  db:
    image: postgres:16-alpine
    container_name: planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - planner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: planner-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://planner:planner@db:5432/planner
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set (see .env.example)}
      JWT_EXPIRES_IN: 30d
      CORS_ORIGIN: "*"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: planner-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

  # HTTPS reverse proxy for production; enabled with COMPOSE_PROFILES=prod in .env
  caddy:
    image: caddy:2-alpine
    container_name: planner-caddy
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  planner-data:
  caddy-data:
  caddy-config:
